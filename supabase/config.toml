project_id = "personal-rpg-console"

[api]
enabled = true
port = 34321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 34322
shadow_port = 34320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 34323

[inbucket]
port = 34324

[analytics]
port = 34327

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# The CLI maps this provider flag to GOTRUE_EXTERNAL_EMAIL_ENABLED.
# Keep email/password login available; auth.enable_signup=false above blocks registration.
enable_signup = true
enable_confirmations = true
