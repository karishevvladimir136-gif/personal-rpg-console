<title>Реестр Железной Бабки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=PT+Mono&display=swap">
<style>
/* Layout: судовой реестр дирижабля — латунная табличка, рычаги-вкладки, панели из кожи с заклёпками; чертёж персонажа в центре куклы. Единственная тёмная тема — осознанно. */
:root{
  --ink:#16110d; --leather:#211913; --leather-2:#2b211a; --leather-3:#36291f;
  --brass:#cfa860; --brass-dim:#8d7142; --copper:#b8703f;
  --verdigris:#64a998; --arcane:#ae93d6; --iron:#9b938a;
  --crimson:#c9563f; --amber:#d99a3e;
  --parch:#eadcbd; --parch-2:#dccaa3; --parch-ink:#2a1f16;
  --text:#ece1cb; --muted:#ab9a80; --line:rgba(207,168,96,.26); --line-strong:rgba(207,168,96,.55);
  --f-display:"Old Standard TT","Times New Roman",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"PT Mono",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(207,168,96,.10),transparent 60%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px);}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}

/* Табличка */
.plate{position:relative;border:1px solid var(--line-strong);background:linear-gradient(180deg,#3a2c1f,#271d15);border-radius:6px;padding:14px 18px 12px;display:grid;gap:4px;box-shadow:inset 0 1px 0 rgba(255,230,180,.12),0 6px 18px rgba(0,0,0,.4)}
.rivets::before,.rivets::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1d79c,#7a5d2e 70%);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.rivets::before{left:8px}.rivets::after{right:8px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim)}
.plate h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,6vw,38px);line-height:1.05;color:var(--brass);letter-spacing:.02em;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.plate .loc{color:var(--muted);font-size:14px}
.plate .loc b{color:var(--text);font-weight:500}

/* Рычаги-вкладки */
.tabs-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:12px calc(-1*max(16px,env(safe-area-inset-left,0px))) 14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,var(--ink) 70%,rgba(22,17,13,.85));border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--leather);border-radius:4px;padding:7px 12px;font-family:var(--f-display);font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:linear-gradient(180deg,#e7c47d,#a98340);border-color:#e7c47d;font-weight:700}

/* Панели */
.panel{position:relative;background:linear-gradient(180deg,var(--leather-2),var(--leather));border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,230,180,.05)}
.h2{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--brass);margin:0 0 10px;text-wrap:balance}
.h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim);margin:0 0 8px}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Выбор персонажа */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--leather);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--text);background:var(--leather-3)}

/* Шкала давления (ХП) */
.gauge{display:grid;gap:6px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gauge-top .val{font-family:var(--f-mono);font-size:18px}
.tube{height:14px;border-radius:7px;background:#0f0b08;border:1px solid var(--line-strong);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.tube>i{display:block;height:100%;border-radius:7px;background:var(--verdigris);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:width .3s}
.tube>i.warn{background:var(--amber)}.tube>i.crit{background:var(--crimson)}
.steppers{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--leather-3);border-radius:4px;min-width:44px;padding:6px 8px;font-family:var(--f-mono);font-size:14px;cursor:pointer}
.step:disabled{opacity:.4;cursor:default}

/* Кукла */
.doll{display:grid;grid-template-columns:1fr minmax(96px,150px) 1fr;gap:8px;align-items:stretch}
.slots{display:grid;gap:6px;align-content:start;min-width:0}
.slot{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--leather);border-radius:5px;padding:6px;min-height:52px;cursor:pointer;min-width:0}
.slot .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-dim);display:block}
.slot .nm{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.empty{border-style:dashed;cursor:default}
.slot.empty .nm{color:var(--muted);font-style:italic}
.slot.att{box-shadow:inset 0 0 0 1px rgba(174,147,214,.35)}
.ico{width:30px;height:30px;display:grid;place-items:center;border-radius:4px;background:#120d0a;border:1px solid var(--line)}
.ico svg{width:20px;height:20px}
.figure{border:1px solid var(--line);border-radius:5px;background:
  linear-gradient(rgba(207,168,96,.06) 1px,transparent 1px) 0 0/12px 12px,
  linear-gradient(90deg,rgba(207,168,96,.06) 1px,transparent 1px) 0 0/12px 12px,#130e0b;display:grid;place-items:center;padding:6px;min-width:0}
.figure svg{width:100%;height:auto;max-width:140px}
.figure.has-img{padding:0;overflow:hidden;cursor:pointer;position:relative;background:#0e0a08}
.figure.has-img img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.figure.has-img::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(207,168,96,.35),inset 0 -30px 30px -20px rgba(0,0,0,.6);pointer-events:none}
.pc-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--brass);box-shadow:0 0 0 2px #120d0a,0 0 0 3px var(--brass-dim);background:#120d0a;display:block}
.ava.ph{display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--brass-dim)}
.ship-hero{margin:-14px -14px 12px;border-radius:6px 6px 0 0;overflow:hidden;border-bottom:1px solid var(--line-strong);position:relative}
.ship-hero img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover}
.roster div.has-ava{grid-template-columns:36px minmax(0,10em) minmax(0,1fr);align-items:center}
.roster .mini{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--brass-dim);display:block}
.roll-out{display:grid;justify-items:center;gap:4px;padding:10px 0 4px;text-align:center}
.roll-total{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.roll-total.crit{color:var(--brass);text-shadow:0 0 18px rgba(207,168,96,.6)}
.roll-total.fail{color:var(--crimson)}
.roll-total.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:.2}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.roll-detail{font-family:var(--f-mono);font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.roll-label{font-size:15px;color:var(--text)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.qbtn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;border:1px solid var(--line);background:var(--leather);border-radius:4px;padding:8px 10px;cursor:pointer;min-width:0}
.qbtn span:first-child{font-size:14px;min-width:0}
.qbtn span:last-child{font-family:var(--f-mono);font-size:13px;color:var(--brass);white-space:nowrap}
.qbtn.dmg span:last-child{color:var(--copper)}
.dice-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.die{position:relative;aspect-ratio:1/1;max-width:100%;border:1.5px solid var(--brass-dim);border-radius:8px;background:radial-gradient(circle at 40% 35%,#3a2c1f,#1a130e 75%);font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--brass);cursor:pointer;padding:0}
.die .n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--brass);color:var(--ink);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;padding:0 4px}
.expr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.expr .e{font-family:var(--f-mono);font-size:18px;color:var(--text);overflow-wrap:anywhere;min-width:0}
.btn-main{border:1px solid #e7c47d;background:linear-gradient(180deg,#e7c47d,#a98340);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:17px;border-radius:4px;padding:8px 18px;cursor:pointer}
.btn-main:disabled{opacity:.45;cursor:default}
.btn-ghost{border:1px solid var(--line);background:var(--leather);border-radius:4px;padding:8px 12px;cursor:pointer;font-size:14px}
.log-row{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line)}
.log-row:last-child{border-bottom:0}
.log-row time{font-family:var(--f-mono);font-size:12px;color:var(--brass-dim)}
.log-row .w{font-size:14px;min-width:0}
.log-row .w small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.log-row .tt{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.log-row .tt.crit{color:var(--brass)}.log-row .tt.fail{color:var(--crimson)}
@media (max-width:520px){.dice-row{grid-template-columns:repeat(4,1fr)}.roll-total{font-size:56px}}
.sheet .portrait{display:block;width:100%;height:auto;border-radius:6px;border:1px solid #8d6d38;margin-top:12px}
.doll-bottom{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* Валики ресурсов */
.res{display:grid;gap:8px}
.res-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.res-row:last-child{border-bottom:0;padding-bottom:0}
.res-name{font-size:14px;min-width:0}
.res-name small{display:block;color:var(--muted);font-size:12.5px}
.pips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pip{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--brass);background:radial-gradient(circle at 35% 35%,#f3d99e,#a17b38 70%);cursor:pointer;padding:0}
.pip.spent{background:transparent;border-color:var(--brass-dim)}
.pip:disabled{cursor:default}

/* Статы */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:5px;background:var(--leather);text-align:center;padding:6px 2px}
.stat .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--brass-dim)}
.stat .m{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--text);line-height:1.1}
.stat .s{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vital{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--leather)}
.vital .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-dim)}
.vital .v{font-family:var(--f-mono);font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:grid;gap:3px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:2px 0}
.kv div span:last-child{font-family:var(--f-mono)}
.feat{border-top:1px dashed var(--line);padding:8px 0}
.feat:first-of-type{border-top:0;padding-top:0}
.feat b{font-weight:700;color:var(--text)}
.feat p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* Инвентарь */
.grid-inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1/1;max-width:100%;border:1.5px solid var(--line);border-radius:5px;background:radial-gradient(circle at 50% 40%,#2a2019,#130e0b 75%);display:grid;place-items:center;cursor:pointer;padding:0}
.cell svg{width:28px;height:28px}
.cell .q{position:absolute;right:3px;bottom:2px;font-family:var(--f-mono);font-size:11px;color:var(--text);background:rgba(0,0,0,.65);border-radius:3px;padding:0 3px}
.cell.e{border-style:dashed;border-color:rgba(207,168,96,.14);background:#120d0a;cursor:default}
.r-common{border-color:#6c655e;color:var(--iron)}
.r-relic{border-color:var(--verdigris);color:var(--verdigris)}
.r-magic{border-color:var(--arcane);color:var(--arcane);box-shadow:0 0 8px rgba(174,147,214,.25)}
.r-story{border-color:var(--brass);color:var(--brass);box-shadow:0 0 10px rgba(207,168,96,.3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1.5px solid currentColor}
.inv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gold{font-family:var(--f-mono);color:var(--brass)}

/* Карточки партии */
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pcard{display:grid;gap:8px;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,var(--leather-2),var(--leather));border-radius:6px;padding:12px;cursor:pointer;min-width:0}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .nm{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--text)}
.pcard .role{font-size:13px;color:var(--muted)}
.ac{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line-strong);border-radius:3px 3px 10px 10px;padding:2px 6px;color:var(--brass);white-space:nowrap}
.pcard .atk{font-size:13.5px;color:var(--muted)}
.roster{display:grid;gap:0}
.roster div{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
.roster div:last-child{border-bottom:0}
.roster b{font-weight:500}

/* Гримуар */
.spell{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;border-bottom:1px dotted var(--line)}
.spell:last-child{border-bottom:0}
.spell .n{font-family:var(--f-display);font-size:17px}
.spell .c{font-family:var(--f-mono);font-size:11px;color:var(--brass-dim);align-self:center}
.spell .x{grid-column:1/-1;font-size:13.5px;color:var(--muted);font-style:italic}

/* Задания */
.quest{border-left:3px solid var(--brass);padding:4px 0 4px 12px;display:grid;gap:4px}
.quest.side{border-left-color:var(--copper)}
.quest .t{font-family:var(--f-display);font-size:18px;font-weight:700}
.quest p{margin:0;font-size:14.5px;color:var(--muted)}
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:14.5px}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.steps li::before{content:"○";color:var(--brass-dim);font-family:var(--f-mono)}
.steps li.ok::before{content:"✓";color:var(--verdigris)}
.steps li.ok{color:var(--muted)}
.bul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14.5px}
details.done summary{cursor:pointer;font-family:var(--f-display);font-size:16px;color:var(--brass)}

/* Кодекс */
.npc{display:grid;gap:2px;padding:8px 0;border-bottom:1px dotted var(--line)}
.npc:last-child{border-bottom:0}
.npc .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.npc b{font-family:var(--f-display);font-size:17px}
.npc p{margin:0;font-size:14px;color:var(--muted)}
.rel{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;padding:2px 6px;white-space:nowrap;border:1px solid currentColor}
.rel-ally{color:var(--verdigris)}.rel-foe{color:var(--crimson)}.rel-murky{color:var(--amber)}.rel-family{color:var(--brass)}.rel-neutral{color:var(--iron)}
.search{width:100%;background:#120d0a;border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--text);font:inherit;font-size:15px}

/* Лист предмета (пергамент) */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,4,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:linear-gradient(180deg,var(--parch),var(--parch-2));color:var(--parch-ink);border-radius:10px 10px 0 0;border:1px solid #b89a5c;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(0,0,0,.6);max-height:80vh;overflow:auto}
.sheet h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1;text-wrap:balance}
.sheet .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7a5c2e}
.sheet p{margin:8px 0 0;font-size:16px;line-height:1.5}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.sheet .btn{border:1px solid #8d6d38;background:#f4ead2;color:var(--parch-ink);border-radius:4px;padding:7px 12px;cursor:pointer;font-family:var(--f-mono)}
.sheet .btn:disabled{opacity:.4;cursor:default}
.sheet .qty{font-family:var(--f-mono);font-size:20px;min-width:3ch;text-align:center}
.sheet .head{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.sheet .bigico{width:48px;height:48px;border-radius:6px;display:grid;place-items:center;background:#2a1f16;border:1.5px solid}
.sheet .bigico svg{width:30px;height:30px}

.empty-state{text-align:center;padding:40px 16px;display:grid;gap:8px;justify-items:center}
.empty-state .gear{width:56px;height:56px;color:var(--brass-dim);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--leather-3);border:1px solid var(--brass);color:var(--text);padding:8px 14px;border-radius:4px;z-index:30;font-size:14px}
.ro{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

@media (max-width:520px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .vitals{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .doll{grid-template-columns:1fr 88px 1fr;gap:6px}
  .slot{grid-template-columns:1fr;gap:3px;padding:5px;min-height:58px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</div>

<div id="toast-root"></div>

<script>
(function(){
const ICON={

photo:'<rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/>',

crowbar:'<path d="M5 21L18 4"/><path d="M18 4l3 2.5"/>',
map:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',

hide:'<path d="M6 4c2 1 4 1 6 0 2 1 4 1 6 0l1 5-2 3 1 9H6l1-9-2-3z"/>',
core:'<rect x="6" y="4" width="12" height="16" rx="3"/><path d="M9 4v16M15 4v16"/><circle cx="12" cy="12" r="2"/>',
cannon:'<path d="M3 15l14-6 2 4-14 5z"/><circle cx="7" cy="18" r="2.5"/>',
harpoon:'<path d="M3 21L20 4"/><path d="M20 4l-1 5M20 4l-5 1M6 15l3 3"/>',
rune:'<path d="M12 3l8 9-8 9-8-9z"/><path d="M12 7v10M9 10l6 4"/>',
crate:'<rect x="4" y="6" width="16" height="13"/><path d="M4 10h16M9 6v4M15 6v4"/>',
briefcase:'<rect x="3" y="7" width="18" height="12" rx="1"/><path d="M9 7V5h6v2M3 12h18"/>',
seal:'<circle cx="12" cy="11" r="6"/><path d="M9 16l-2 5 5-2 5 2-2-5"/>',

};
const icon=(k,cls)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"'+(cls?' class="'+cls+'"':'')+' aria-hidden="true">'+(ICON[k]||ICON.crate)+'</svg>';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAR={common:'обычное',relic:'реликт Старого мира',magic:'магическое',story:'сюжетное'};
const SLOT_L=[['head','Голова'],['neck','Шея'],['talisman','Талисман'],['body','Тело'],['cloak','Плащ']];
const SLOT_R=[['main','Осн. рука'],['off','Вторая рука'],['ring1','Кольцо I'],['ring2','Кольцо II'],['hands','Руки']];
const SLOT_B=[['belt','Пояс'],['feet','Ноги']];
const TABS=[['party','Партия'],['hero','Персонаж'],['dice','Кубы'],['inv','Инвентарь'],['spells','Гримуар'],['quests','Задания'],['codex','Кодекс'],['ship','Корабль']];
const CATS=[['all','Всё'],['consumable','Расходники'],['gear','Снаряжение'],['relic','Реликты'],['story','Сюжет']];

const S={chars:{},world:{},ready:{chars:false,world:false},tab:'party',who:'james',cat:'all',book:'james',q:'',sheet:null,offline:false};
try{const t=localStorage.getItem('reestr.tab');if(t)S.tab=t;const w=localStorage.getItem('reestr.who');if(w)S.who=w;}catch(e){}
const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;

let db=null,canWrite=null,readOnly=false;
const queue={},inflight={},timers={};
const writable=()=>!!db&&!readOnly&&canWrite!==false;

function toast(msg){const r=document.getElementById('toast-root');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{r.innerHTML=''},2200);}
function local(path){const [c,id]=path.split('/');return c==='chars'?S.chars[id]:S.world[id];}
function setLocal(path,obj){const [c,id]=path.split('/');const box=c==='chars'?S.chars:S.world;box[id]=Object.assign({},box[id]||{},obj);}
function patch(path,obj){if(!writable())return;setLocal(path,obj);queue[path]=Object.assign(queue[path]||{},obj);clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),450);render();}
async function flush(path){
  if(inflight[path]){timers[path]=setTimeout(()=>flush(path),300);return;}
  const p=queue[path];if(!p)return;delete queue[path];inflight[path]=true;
  try{await db.doc(path).update(p);}
  catch(e){const c=e&&e.code;
    if(c==='invalid_argument'){readOnly=true;toast('Этот реестр открыт только для чтения');render();}
    else if(c==='unavailable'){queue[path]=Object.assign({},p,queue[path]||{});timers[path]=setTimeout(()=>flush(path),700+Math.random()*700);}
    else toast('Не удалось сохранить изменение');}
  finally{inflight[path]=false;}
}
function applySnap(box,snap){snap.docs.forEach(d=>{box[d.id]=d.data();});
  snap.docChanges().forEach(ch=>{if(ch.type==='removed')delete box[ch.doc.id];});
  Object.keys(queue).forEach(p=>{const [c,id]=p.split('/');if((c==='chars'?S.chars:S.world)===box&&box[id])box[id]=Object.assign({},box[id],queue[p]);});}

/* ---------- views ---------- */
const strike=()=>Object.entries(S.chars).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
function hpCls(hp,max){const r=max?hp/max:0;return r<=.25?'crit':r<=.5?'warn':'';}
function tube(hp,max){const w=max?Math.max(0,Math.min(100,hp/max*100)):0;return '<div class="tube" role="meter" aria-valuemin="0" aria-valuemax="'+max+'" aria-valuenow="'+hp+'"><i class="'+hpCls(hp,max)+'" style="width:'+w+'%"></i></div>';}
function whoChips(list,cur,attr){return '<div class="chips" role="group" aria-label="Персонаж">'+list.map(([id,c])=>'<button class="chip" data-'+attr+'="'+esc(id)+'" aria-pressed="'+(id===cur)+'">'+esc(c.short||c.name)+'</button>').join('')+'</div>';}

function vParty(){
  const m=S.world.meta||{},crew=S.world.crew||{};
  let out='<div class="stack">';
  if(m.objective)out+='<section class="panel"><div class="h3">Текущая цель</div><div style="font-family:var(--f-display);font-size:19px">'+esc(m.objective)+'</div>'+(m.note?'<p class="muted small" style="margin:6px 0 0">'+esc(m.note)+'</p>':'')+'</section>';
  out+='<section><div class="h3">Ударная группа</div><div class="party">'+strike().map(([id,c])=>
    '<button class="pcard" data-open="'+esc(id)+'"><div class="pc-head">'+(c.avatar?'<img class="ava" src="'+esc(c.avatar)+'" alt="">':'<span class="ava ph" aria-hidden="true">'+esc((c.short||c.name||'?').charAt(0))+'</span>')+'<div style="min-width:0"><div class="nm">'+esc(c.name)+'</div><div class="role">'+esc(c.title||'')+'</div></div><span class="ac">КД '+esc(c.ac)+'</span></div>'+
    '<div class="gauge"><div class="gauge-top"><span class="eyebrow">Хиты</span><span class="num">'+esc(c.hp)+' / '+esc(c.hpMax)+'</span></div>'+tube(c.hp,c.hpMax)+'</div>'+
    (c.attack?'<div class="atk">'+esc(c.attack)+'</div>':'')+'</button>').join('')+'</div></section>';
  if(crew.aboard)out+='<section class="panel"><div class="h2">На борту</div>'+rosterHtml(crew.aboard)+'</section>';
  if(crew.home)out+='<section class="panel"><div class="h2">Остались в Нуйорк-Гхаре</div>'+rosterHtml(crew.home)+'</section>';
  return out+'</div>';
}

function rosterHtml(list){const any=list.some(p=>p.avatar);return '<div class="roster">'+list.map(p=>'<div'+(any?' class="has-ava"':'')+'>'+(any?(p.avatar?'<img class="mini" src="'+esc(p.avatar)+'" alt="">':'<span class="mini" aria-hidden="true"></span>'):'')+'<b>'+esc(p.name)+'</b><span class="muted">'+esc(p.role)+'</span></div>').join('')+'</div>';}
function slotBtn(c,key,label){const it=(c.slots||{})[key];
  if(!it)return '<div class="slot empty"><span class="ico" aria-hidden="true"></span><span><span class="lbl">'+label+'</span><span class="nm">пусто</span></span></div>';
  return '<button class="slot'+(it.attuned?' att':'')+'" data-slot="'+key+'"><span class="ico r-'+esc(it.rarity||'common')+'">'+icon(it.icon)+'</span><span style="min-width:0"><span class="lbl">'+label+(it.attuned?' · ✦':'')+'</span><span class="nm">'+esc(it.name)+'</span></span></button>';}
const FIG='<svg viewBox="0 0 120 230" fill="none" stroke="var(--brass)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g opacity=".9"><circle cx="60" cy="30" r="15"/><path d="M54 45v6h12v-6"/><path d="M38 56l22-5 22 5 4 52-8 2-4-38-4 40H46l-4-40-4 38-8-2z"/><path d="M46 110l-3 70 6 36h9l-1-36 3-62 3 62-1 36h9l6-36-3-70"/><path d="M60 51v59"/></g><g stroke="var(--brass-dim)" stroke-width=".8" stroke-dasharray="2 3"><path d="M8 15v201M4 15h8M4 216h8"/><path d="M100 30h14M100 112h14M107 30v82"/></g><text x="4" y="226" fill="var(--brass-dim)" stroke="none" font-family="PT Mono,monospace" font-size="7">1:12</text><text x="92" y="226" fill="var(--brass-dim)" stroke="none" font-family="PT Mono,monospace" font-size="7">ЧЕРТ.</text></svg>';

function vHero(){
  const list=strike();if(!list.length)return emptyState();
  if(!S.chars[S.who])S.who=list[0][0];
  const id=S.who,c=S.chars[id],w=writable();
  const att=Object.values(c.slots||{}).filter(x=>x&&x.attuned).length;
  let out='<div class="stack">'+whoChips(list,id,'who');
  out+='<section class="panel"><div class="inv-head"><div><div class="h2" style="margin:0">'+esc(c.name)+'</div><div class="muted small">'+esc(c.title||'')+'</div></div><span class="eyebrow">Настройка '+att+'/3</span></div>'+
    '<div class="doll" style="margin-top:12px"><div class="slots">'+SLOT_L.map(s=>slotBtn(c,s[0],s[1])).join('')+'</div>'+(c.full?'<button class="figure has-img" data-portrait="1" aria-label="Портрет: '+esc(c.name)+'"><img src="'+esc(c.full)+'" alt=""></button>':'<div class="figure">'+FIG+'</div>')+'<div class="slots">'+SLOT_R.map(s=>slotBtn(c,s[0],s[1])).join('')+'</div><div class="doll-bottom">'+SLOT_B.map(s=>slotBtn(c,s[0],s[1])).join('')+'</div></div></section>';
  out+='<section class="panel"><div class="gauge"><div class="gauge-top"><span class="h3" style="margin:0">Хиты</span><span class="val">'+esc(c.hp)+' / '+esc(c.hpMax)+'</span></div>'+tube(c.hp,c.hpMax)+
    '<div class="steppers">'+[-10,-5,-1,1,5,10].map(d=>'<button class="step" data-hp="'+d+'"'+(w?'':' disabled')+'>'+(d>0?'+':'−')+Math.abs(d)+'</button>').join('')+'<button class="step" data-hp="full"'+(w?'':' disabled')+'>Полные</button></div></div>'+
    '<div class="vitals" style="margin-top:12px">'+(c.vitals||[]).map(v=>'<div class="vital"><div class="k">'+esc(v[0])+'</div><div class="v">'+esc(v[1])+'</div></div>').join('')+'</div></section>';
  if(c.resources&&c.resources.length)out+='<section class="panel"><div class="h2">Ресурсы</div><div class="res">'+c.resources.map((r,i)=>'<div class="res-row"><div class="res-name">'+esc(r.name)+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</div><div class="pips">'+Array.from({length:r.max},(_,j)=>{const spent=j>=r.max-(r.used||0);return '<button class="pip'+(spent?' spent':'')+'" data-res="'+i+'" data-j="'+j+'" aria-label="'+esc(r.name)+' '+(j+1)+(spent?', потрачено':', доступно')+'"'+(w?'':' disabled')+'></button>';}).join('')+'</div></div>').join('')+'</div>'+(w?'':'<div class="ro" style="margin-top:8px">только просмотр</div>')+'</section>';
  if(c.stats)out+='<section class="panel"><div class="h2">Характеристики</div><div class="stats">'+c.stats.map(s=>'<div class="stat"><div class="k">'+esc(s[0])+'</div><div class="m">'+esc(s[2])+'</div><div class="s">'+esc(s[1])+'</div></div>').join('')+'</div></section>';
  if(c.saves||c.skills)out+='<section class="panel two">'+(c.saves?'<div><div class="h3">Спасброски</div><div class="kv">'+c.saves.map(s=>'<div><span>'+esc(s[0])+'</span><span>'+esc(s[1])+'</span></div>').join('')+'</div></div>':'')+(c.skills?'<div><div class="h3">Навыки</div><div class="kv">'+c.skills.map(s=>'<div><span>'+esc(s[0])+'</span><span>'+esc(s[1])+'</span></div>').join('')+'</div></div>':'')+'</section>';
  if(c.features&&c.features.length)out+='<section class="panel"><div class="h2">Особенности</div>'+c.features.map(f=>'<div class="feat"><b>'+esc(f.name)+'</b><p>'+esc(f.desc)+'</p></div>').join('')+'</section>';
  if(c.bio)out+='<section class="panel"><div class="h2">Досье</div><p class="muted" style="margin:0">'+esc(c.bio)+'</p></section>';
  return out+'</div>';
}

function invGrid(items,ctx,minCells){
  const cells=items.map(({it,i})=>'<button class="cell r-'+esc(it.rarity||'common')+'" data-item="'+i+'" data-ctx="'+esc(ctx)+'" aria-label="'+esc(it.name)+(it.qty>1?', '+it.qty:'')+'">'+icon(it.icon)+(it.qty>1?'<span class="q">'+esc(it.qty)+'</span>':'')+'</button>');
  const pad=Math.max(0,(minCells||0)-cells.length);for(let k=0;k<pad;k++)cells.push('<div class="cell e" aria-hidden="true"></div>');
  return '<div class="grid-inv">'+cells.join('')+'</div>';
}
const legend='<div class="legend"><span style="color:var(--iron)">обычное</span><span style="color:var(--verdigris)">реликт</span><span style="color:var(--arcane)">магическое</span><span style="color:var(--brass)">сюжетное</span></div>';
function vInv(){
  const list=strike();if(!list.length)return emptyState();
  if(!S.chars[S.who])S.who=list[0][0];
  const c=S.chars[S.who],inv=(c.inventory||[]).map((it,i)=>({it,i}));
  const shown=S.cat==='all'?inv:inv.filter(x=>x.it.cat===S.cat);
  return '<div class="stack">'+whoChips(list,S.who,'who')+
   '<section class="panel stack"><div class="inv-head"><div class="h2" style="margin:0">'+esc(c.short||c.name)+': снаряжение</div>'+(c.gold!=null?'<span class="gold">'+esc(c.gold)+' зм</span>':'')+'</div>'+
   '<div class="chips" role="group" aria-label="Категория">'+CATS.map(k=>'<button class="chip" data-cat="'+k[0]+'" aria-pressed="'+(S.cat===k[0])+'">'+k[1]+'</button>').join('')+'</div>'+
   invGrid(shown,'chars/'+S.who,S.cat==='all'?30:12)+legend+'<div class="muted small">Нажми на клетку, чтобы прочитать описание'+(writable()?' и поменять количество':'')+'.</div></section></div>';
}

function vSpells(){
  const sp=S.world.spells;if(!sp||!sp.books)return emptyState();
  if(!sp.books.some(b=>b.id===S.book))S.book=sp.books[0].id;
  const b=sp.books.find(x=>x.id===S.book);
  return '<div class="stack"><div class="chips">'+sp.books.map(x=>'<button class="chip" data-book="'+esc(x.id)+'" aria-pressed="'+(x.id===S.book)+'">'+esc(x.owner)+'</button>').join('')+'</div>'+
   (b.meta?'<div class="panel"><div class="kv">'+b.meta.map(m=>'<div><span>'+esc(m[0])+'</span><span>'+esc(m[1])+'</span></div>').join('')+'</div></div>':'')+
   b.sections.map(s=>'<section class="panel"><div class="h2">'+esc(s.title)+'</div>'+(s.note?'<p class="muted small" style="margin:-4px 0 8px">'+esc(s.note)+'</p>':'')+s.items.map(i=>'<div class="spell"><span class="n">'+esc(i.name)+'</span><span class="c">'+esc(i.lvl||'')+'</span>'+(i.note?'<span class="x">'+esc(i.note)+'</span>':'')+'</div>').join('')+'</section>').join('')+'</div>';
}

function vQuests(){
  const q=S.world.quests;if(!q)return emptyState();
  let out='<div class="stack">';
  (q.main||[]).forEach(m=>{out+='<section class="panel"><div class="h3">Главная арка</div><div class="quest"><span class="t">'+esc(m.title)+'</span><p>'+esc(m.desc)+'</p>'+(m.steps?'<ul class="steps">'+m.steps.map(s=>'<li class="'+(s.done?'ok':'')+'">'+esc(s.text)+'</li>').join('')+'</ul>':'')+'</div></section>';});
  if(q.active&&q.active.length)out+='<section class="panel stack"><div class="h2" style="margin:0">Задания</div>'+q.active.map(a=>'<div class="quest side"><span class="t">'+esc(a.title)+'</span><p>'+esc(a.desc)+'</p></div>').join('')+'</section>';
  if(q.threads&&q.threads.length)out+='<section class="panel"><div class="h2">Открытые нити</div><ul class="bul">'+q.threads.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></section>';
  if(q.debts&&q.debts.length)out+='<section class="panel"><div class="h2">Долги и обещания</div><ul class="bul">'+q.debts.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></section>';
  if(q.done&&q.done.length)out+='<section class="panel"><details class="done"><summary>Выполнено · '+q.done.length+'</summary><div class="stack" style="margin-top:10px">'+q.done.map(a=>'<div class="quest side" style="border-left-color:var(--verdigris)"><span class="t">'+esc(a.title)+'</span><p>'+esc(a.desc)+'</p></div>').join('')+'</div></details></section>';
  return out+'</div>';
}

const RELS={family:'семья',ally:'союзник',murky:'мутный',foe:'враг',neutral:'нейтрал'};
function vCodex(){
  const c=S.world.codex;if(!c)return emptyState();
  const q=S.q.trim().toLowerCase();
  const match=n=>!q||(n.name+' '+n.who+' '+(n.note||'')).toLowerCase().includes(q);
  const order=['family','ally','murky','neutral','foe'];
  let out='<div class="stack"><label class="panel" style="display:block"><span class="h3" style="display:block">Поиск по кодексу</span><input id="codex-q" class="search" type="search" placeholder="Имя, место, фракция" value="'+esc(S.q)+'"></label>';
  order.forEach(r=>{const items=(c.npcs||[]).filter(n=>n.rel===r&&match(n));if(!items.length)return;
    out+='<section class="panel"><div class="h2">'+({family:'Семья',ally:'Союзники',murky:'Мутные',neutral:'Нейтральные',foe:'Враги'}[r])+'</div>'+items.map(n=>'<div class="npc"><div class="row"><b>'+esc(n.name)+'</b><span class="rel rel-'+r+'">'+RELS[r]+'</span></div><p>'+esc(n.who)+'</p>'+(n.note?'<p style="color:var(--text);opacity:.85">'+esc(n.note)+'</p>':'')+'</div>').join('')+'</section>';});
  if(c.factions)out+='<section class="panel"><div class="h2">Фракции</div>'+c.factions.filter(match).map(f=>'<div class="npc"><div class="row"><b>'+esc(f.name)+'</b><span class="rel rel-'+esc(f.rel)+'">'+esc(f.status)+'</span></div><p>'+esc(f.who)+'</p></div>').join('')+'</section>';
  return out+'</div>';
}

function vShip(){
  const s=S.world.ship;if(!s)return emptyState();
  const hold=(s.hold||[]).map((it,i)=>({it,i}));
  return '<div class="stack"><section class="panel">'+(s.image?'<div class="ship-hero"><img src="'+esc(s.image)+'" alt="'+esc(s.name)+'"></div>':'')+'<div class="h2">'+esc(s.name)+'</div><p class="muted" style="margin:0 0 10px">'+esc(s.desc)+'</p><div class="kv">'+(s.specs||[]).map(x=>'<div><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>').join('')+'</div></section>'+
   '<section class="panel"><div class="h2">Вооружение</div>'+(s.weapons||[]).map(x=>'<div class="feat"><b>'+esc(x.name)+'</b><p>'+esc(x.desc)+'</p></div>').join('')+'</section>'+
   '<section class="panel stack"><div class="h2" style="margin:0">Трюм</div>'+invGrid(hold,'world/ship',18)+legend+'</section>'+
   (s.guests?'<section class="panel"><div class="h2">Пассажиры и пленные</div>'+rosterHtml(s.guests)+'</section>':'')+'</div>';
}

/* ---------- кубы ---------- */
const DIE=[4,6,8,10,12,20,100];
const D={pool:{},mod:0,mode:'norm',note:'',last:null,key:0};
let LOG=[],logBusy=false,logAgain=false,logLocal=false;
function rnd(n){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=lim);return x%n+1;}
function exprFromPool(){const parts=DIE.filter(d=>D.pool[d]).map(d=>D.pool[d]+'d'+d);let s=parts.join('+');if(D.mod)s+=(D.mod>0?'+':'−')+Math.abs(D.mod);return s;}
function rollExpr(expr){
  const toks=expr.replace(/\s/g,'').replace(/−/g,'-').match(/[+-]?[^+-]+/g)||[];
  let total=0;const det=[];
  toks.forEach((t,i)=>{const sg=t[0]==='-'?-1:1;const b=t.replace(/^[+-]/,'');const m=b.match(/^(\d*)d(\d+)$/i);const pre=i===0?(sg<0?'−':''):(sg<0?' − ':' + ');
    if(m){const n=+(m[1]||1),f=+m[2];const v=Array.from({length:Math.min(n,100)},()=>rnd(f));const s=v.reduce((a,b)=>a+b,0);total+=sg*s;det.push(pre+n+'d'+f+' ('+v.join(', ')+')');}
    else if(/^\d+$/.test(b)){total+=sg*(+b);det.push(pre+b);}});
  return {total,detail:det.join('')};
}
function rollD20(bonus){
  const a=rnd(20);let pick=a,txt='d20 ('+a+')';
  if(D.mode!=='norm'){const b=rnd(20);pick=D.mode==='adv'?Math.max(a,b):Math.min(a,b);txt='d20 ('+a+' | '+b+' → '+pick+')';}
  const total=pick+bonus;txt+=bonus?(bonus>0?' + ':' − ')+Math.abs(bonus):'';
  return {total,detail:txt+(D.mode==='adv'?' · преим.':D.mode==='dis'?' · помеха':''),flag:pick===20?'crit':pick===1?'fail':''};
}
function pushRoll(label,res){
  const c=S.chars[S.who]||{};
  const e={t:Date.now(),who:c.short||c.name||'',label:label+(D.note?' — '+D.note:''),detail:res.detail,total:res.total,flag:res.flag||''};
  D.last=e;D.key++;D.note='';
  LOG=[e].concat(LOG).slice(0,40);logLocal=true;render();saveLog();
}
async function saveLog(){
  if(!db||readOnly||canWrite===false){return;}
  if(logBusy){logAgain=true;return;}
  logBusy=true;
  try{await db.doc('log/rolls').set({items:LOG});}
  catch(e){if(e&&e.code==='invalid_argument'){readOnly=true;toast('Журнал бросков только для чтения');}else toast('Бросок не записался в журнал');}
  finally{logBusy=false;if(logAgain){logAgain=false;saveLog();}else logLocal=false;}
}
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
function vDice(){
  const list=strike();
  if(list.length&&!S.chars[S.who])S.who=list[0][0];
  const c=S.chars[S.who]||{};
  const L=D.last;const ex=exprFromPool();
  let out='<div class="stack">'+(list.length?whoChips(list,S.who,'who'):'');
  out+='<section class="panel"><div class="roll-out" aria-live="polite">'+(L?'<div class="roll-label">'+esc(L.who)+': '+esc(L.label)+'</div><div class="roll-total '+esc(L.flag)+(D.key!==D.shown?' pop':'')+'">'+esc(L.total)+'</div><div class="roll-detail">'+esc(L.detail)+'</div>'+(L.flag==='crit'?'<div class="eyebrow" style="color:var(--brass)">Натуральная двадцатка</div>':L.flag==='fail'?'<div class="eyebrow" style="color:var(--crimson)">Натуральная единица</div>':''):'<div class="roll-total" style="color:var(--brass-dim)">d20</div><div class="roll-detail">Выбери бросок ниже</div>')+'</div>'+
    '<div class="chips" role="group" aria-label="Режим d20" style="justify-content:center;margin-top:10px">'+[['norm','Обычный'],['adv','Преимущество'],['dis','Помеха']].map(m=>'<button class="chip" data-mode="'+m[0]+'" aria-pressed="'+(D.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<label style="display:block;margin-top:10px"><span class="h3" style="display:block">Зачем бросок</span><input id="roll-note" class="search" type="text" maxlength="60" placeholder="Например: вскрыть замок" value="'+esc(D.note)+'"></label></section>';
  if(c.rolls&&c.rolls.length){
    const d20=c.rolls.filter(r=>r.kind==='d20'),dmg=c.rolls.filter(r=>r.kind!=='d20');
    out+='<section class="panel stack"><div class="h2" style="margin:0">Быстрые броски · '+esc(c.short||c.name)+'</div>'+
      (d20.length?'<div><div class="h3">Проверки, атаки, спасброски</div><div class="qgrid">'+d20.map(r=>'<button class="qbtn" data-q="'+c.rolls.indexOf(r)+'"><span>'+esc(r.label)+'</span><span>'+(r.bonus>=0?'+':'−')+Math.abs(r.bonus)+'</span></button>').join('')+'</div></div>':'')+
      (dmg.length?'<div><div class="h3">Урон и лечение</div><div class="qgrid">'+dmg.map(r=>'<button class="qbtn dmg" data-q="'+c.rolls.indexOf(r)+'"><span>'+esc(r.label)+'</span><span>'+esc(r.expr)+'</span></button>').join('')+'</div></div>':'')+'</section>';
  }
  D.shown=D.key;
  out+='<section class="panel stack"><div class="h2" style="margin:0">Свои кубы</div><div class="dice-row">'+DIE.map(d=>'<button class="die" data-die="'+d+'" aria-label="Добавить d'+d+'">d'+d+(D.pool[d]?'<span class="n">'+D.pool[d]+'</span>':'')+'</button>').join('')+'</div>'+
    '<div class="expr"><span class="e">'+(ex||'—')+'</span><span class="steppers"><button class="step" data-mod="-1" aria-label="Модификатор минус 1">−1</button><button class="step" data-mod="1" aria-label="Модификатор плюс 1">+1</button></span></div>'+
    '<div class="expr"><button class="btn-ghost" data-clear="1">Сбросить</button><button class="btn-main" data-rollpool="1"'+(DIE.some(d=>D.pool[d])?'':' disabled')+'>Бросить</button></div></section>';
  out+='<section class="panel"><div class="inv-head"><div class="h2" style="margin:0">Журнал бросков</div>'+(db&&!readOnly&&canWrite!==false?'<span class="ro">ДМ видит этот журнал</span>':'<span class="ro">журнал только в этом окне</span>')+'</div>'+
    (LOG.length?'<div style="margin-top:8px">'+LOG.slice(0,20).map(e=>'<div class="log-row"><time>'+hhmm(e.t)+'</time><div class="w">'+esc(e.who)+': '+esc(e.label)+'<small>'+esc(e.detail)+'</small></div><span class="tt '+esc(e.flag||'')+'">'+esc(e.total)+'</span></div>').join('')+'</div>':'<p class="muted small" style="margin:8px 0 0">Бросков пока нет. Первый бросок появится здесь.</p>')+'</section>';
  return out+'</div>';
}

function emptyState(){
  const msg=S.offline?'Реестр работает только на опубликованной странице, когда ты вошёл в claude.ai.':(S.ready.chars&&S.ready.world?'Реестр пуст. Попроси ДМа занести в него партию после сессии.':'Сверяем журнал с базой…');
  return '<div class="panel empty-state"><svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">'+ICON.gear+'</svg><div class="h2" style="margin:0">Механизм прогревается</div><p class="muted" style="margin:0;max-width:40ch">'+esc(msg)+'</p></div>';
}

function renderSheet(){
  const root=document.getElementById('sheet-root');
  if(!S.sheet){root.innerHTML='';return;}
  let it,canQty=false,ctx=S.sheet;
  if(ctx.kind==='portrait'){const c=S.chars[ctx.who];const src=c&&(c.bust||c.full);if(!src){S.sheet=null;root.innerHTML='';return;}
    root.innerHTML='<div class="sheet-bg" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="row" style="margin-top:0"><div><div class="tag">'+esc(c.title||'')+'</div><h3 id="sh-t">'+esc(c.name)+'</h3></div><button class="btn" data-close="1">Закрыть</button></div><img class="portrait" src="'+esc(src)+'" alt="Портрет: '+esc(c.name)+'"></div>';
    const b=root.querySelector('.sheet .btn');if(b&&!renderSheet.focused){b.focus();renderSheet.focused=true;}return;}
  if(ctx.kind==='slot'){it=((S.chars[ctx.who]||{}).slots||{})[ctx.key];}
  else{const box=local(ctx.ctx);it=box&&(ctx.ctx==='world/ship'?box.hold:box.inventory)?.[ctx.i];canQty=writable()&&it&&it.qty!=null;}
  if(!it){S.sheet=null;root.innerHTML='';return;}
  const r=it.rarity||'common';
  root.innerHTML='<div class="sheet-bg" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="head"><div class="bigico r-'+esc(r)+'">'+icon(it.icon)+'</div><div><div class="tag">'+esc(RAR[r]||r)+(it.attuned?' · настроено':'')+'</div><h3 id="sh-t">'+esc(it.name)+'</h3></div></div>'+
   '<p>'+esc(it.desc||'')+'</p>'+
   '<div class="row">'+(it.qty!=null?'<div style="display:flex;align-items:center;gap:8px"><button class="btn" data-qty="-1"'+(canQty&&it.qty>0?'':' disabled')+' aria-label="Убрать одну">−1</button><span class="qty">'+esc(it.qty)+'</span><button class="btn" data-qty="1"'+(canQty?'':' disabled')+' aria-label="Добавить одну">+1</button></div>':'<span></span>')+
   '<button class="btn" data-close="1">Закрыть</button></div></div>';
  const btn=root.querySelector('.sheet .btn[data-close]');if(btn&&!renderSheet.focused){btn.focus();renderSheet.focused=true;}
}

function render(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>'<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>').join('');
  const m=S.world.meta;
  document.getElementById('loc').innerHTML=m?'<b>'+esc(m.location)+'</b> · '+esc(m.time||'')+(m.next?' · дальше: '+esc(m.next):''):(S.offline?'Нет связи с базой реестра':'Сверяем журнал…');
  const v=document.getElementById('view');
  const ae=document.activeElement;const keepId=ae&&(ae.id==='codex-q'||ae.id==='roll-note')?ae.id:null;
  const pos=keepId?ae.selectionStart:0;
  if(S.tab!=='dice'&&!Object.keys(S.chars).length&&!Object.keys(S.world).length)v.innerHTML=emptyState();
  else v.innerHTML=({party:vParty,hero:vHero,dice:vDice,inv:vInv,spells:vSpells,quests:vQuests,codex:vCodex,ship:vShip}[S.tab]||vParty)();
  if(keepId){const i=document.getElementById(keepId);if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}}
  renderSheet();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;try{localStorage.setItem('reestr.tab',S.tab)}catch(_){ }window.scrollTo({top:0});render();return;}
  if(d.who){S.who=d.who;try{localStorage.setItem('reestr.who',S.who)}catch(_){ }render();return;}
  if(d.open){S.who=d.open;S.tab='hero';render();window.scrollTo({top:0});return;}
  if(d.cat){S.cat=d.cat;render();return;}
  if(d.book){S.book=d.book;render();return;}
  if(d.close){S.sheet=null;renderSheet.focused=false;render();return;}
  if(d.mode){D.mode=d.mode;render();return;}
  if(d.die){D.pool[d.die]=(D.pool[d.die]||0)+1;render();return;}
  if(d.mod){D.mod+=(+d.mod);render();return;}
  if(d.clear){D.pool={};D.mod=0;render();return;}
  if(d.rollpool){const ex=exprFromPool();if(!ex)return;const r=rollExpr(ex.replace(/−/g,'-'));pushRoll(ex,r);return;}
  if(d.q!=null){const c=S.chars[S.who];const r=c&&c.rolls&&c.rolls[+d.q];if(!r)return;
    if(r.kind==='d20')pushRoll(r.label,rollD20(+r.bonus||0));else pushRoll(r.label,rollExpr(r.expr));return;}
  if(d.portrait){S.sheet={kind:'portrait',who:S.who};renderSheet.focused=false;render();return;}
  if(d.slot){S.sheet={kind:'slot',who:S.who,key:d.slot};renderSheet.focused=false;render();return;}
  if(d.item!=null&&d.ctx){S.sheet={kind:'item',ctx:d.ctx,i:+d.item};renderSheet.focused=false;render();return;}
  if(d.hp){const c=S.chars[S.who];if(!c)return;const n=d.hp==='full'?c.hpMax:Math.max(0,Math.min(c.hpMax,c.hp+(+d.hp)));if(n!==c.hp)patch('chars/'+S.who,{hp:n});return;}
  if(d.res!=null){const c=S.chars[S.who];const res=(c.resources||[]).map(r=>Object.assign({},r));const r=res[+d.res];const j=+d.j;const avail=r.max-(r.used||0);
    r.used=j<avail? r.max-j : r.max-j-1; r.used=Math.max(0,Math.min(r.max,r.used));
    patch('chars/'+S.who,{resources:res});return;}
  if(d.qty&&S.sheet&&S.sheet.kind==='item'){const ctx=S.sheet.ctx,box=local(ctx),field=ctx==='world/ship'?'hold':'inventory';const arr=(box[field]||[]).map(x=>Object.assign({},x));const it=arr[S.sheet.i];if(!it)return;it.qty=Math.max(0,(it.qty||0)+(+d.qty));patch(ctx,{[field]:arr});return;}
});
document.addEventListener('input',e=>{if(e.target.id==='codex-q'){S.q=e.target.value;render();}else if(e.target.id==='roll-note'){D.note=e.target.value;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});

render();
(async()=>{
  if(!window.claude||!window.claude.use){S.offline=true;render();return;}
  db=await window.claude.use('db');
  if(!db){S.offline=true;render();return;}
  try{const u=await window.claude.use('user');if(u&&u.can){const v=await u.can('data.write');canWrite=v===false?false:v;}}catch(_){}
  db.collection('chars').onSnapshot(s=>{applySnap(S.chars,s);S.ready.chars=true;render();},()=>{S.ready.chars=true;render();});
  db.collection('world').onSnapshot(s=>{applySnap(S.world,s);S.ready.world=true;render();},()=>{S.ready.world=true;render();});
  db.doc('log/rolls').onSnapshot(s=>{if(logLocal||logBusy)return;const it=s.exists&&s.data().items;LOG=Array.isArray(it)?it.slice():[];if(S.tab==='dice'&&document.activeElement?.id!=='roll-note')render();},()=>{});
})();
})();
</script>
